[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "repo2drawio"
version = "0.12.0"
description = "Paste a GitHub repository and get an editable Draw.io architecture diagram."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "repo2drawio contributors" }]
keywords = ["architecture", "drawio", "diagram", "codex", "agent-skill"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Documentation",
  "Topic :: Software Development :: Documentation",
]
dependencies = [
  "fastapi>=0.115,<1",
  "PyYAML>=6,<7",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1"]

[project.urls]
Homepage = "https://github.com/ardkyer/repo2drawio"
Repository = "https://github.com/ardkyer/repo2drawio"
Issues = "https://github.com/ardkyer/repo2drawio/issues"

[project.scripts]
repo2drawio = "repo2drawio.cli:main"
repo2drawio-web = "repo2drawio.web:main"

[tool.setuptools.package-data]
repo2drawio = ["static/*.html", "static/*.css", "static/*.js", "static/examples/*"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
